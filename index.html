  <meta name="color-scheme" content="light dark">
  <script>
    // Оформление и тема — до первой отрисовки (без вспышки). Источник: localStorage['srpski:v1'].settings
    (function () {
      var r = document.documentElement, s = {};
      try { s = (JSON.parse(localStorage.getItem('srpski:v1')) || {}).settings || {}; } catch (e) {}
      r.dataset.style = 'b';
      var t = s.theme === 'light' || s.theme === 'dark' ? s.theme : null;
      if (t) r.dataset.theme = t;
      r.dataset.mode = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
